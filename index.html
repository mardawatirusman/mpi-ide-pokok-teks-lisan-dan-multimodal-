<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPI Ide Pokok – Teks Lisan dan Multimodal</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{--p:#d81b60;--pl:#fde4ee;--pb:#fff4f8;--b:#7fb7e6;--bl:#e3f1fc;--t:#3b1f2b;--ok:#2e9d62;--no:#d64545}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--t);background:linear-gradient(135deg,var(--pb),var(--bl));font-size:clamp(15px,2.2vw,18px);line-height:1.55}
.scr{display:none;min-height:100vh;padding:16px;align-items:center;justify-content:center;flex-direction:column}
.scr.on{display:flex}
.card{width:100%;max-width:780px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid #fff;border-radius:26px;padding:clamp(16px,3vw,30px);box-shadow:0 10px 36px rgba(216,27,96,.15)}
h1,h2,h3{margin:.3em 0;color:var(--p)}h1{font-size:clamp(24px,5vw,38px)}h2{font-size:clamp(20px,3.6vw,28px)}
.btn,button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 22px;background:var(--p);color:#fff;cursor:pointer;margin:4px}
button.alt{background:var(--b);color:#143a5a}button:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-block;background:var(--bl);color:#1d5a8c;border-radius:999px;padding:3px 14px;font-weight:800;margin:3px;font-size:.85em}
.c{text-align:center}.pulse{animation:pu 1.4s infinite}@keyframes pu{50%{transform:scale(1.07)}}
.bar{transform-box:fill-box;transform-origin:center;animation:bw 1s ease-in-out infinite}@keyframes bw{50%{transform:scaleY(.35)}}
.box{border-radius:16px;padding:10px 14px;margin:8px 0}.loc{background:var(--bl)}.kbc{background:var(--pl)}
.ay{background:#fff;border:2px dashed var(--p);border-radius:16px;padding:10px;text-align:center;margin:8px 0}
.ar{font-family:Amiri,'Traditional Arabic',serif;font-size:1.7em;direction:rtl;line-height:1.9}.ay p{margin:2px}
.stim{background:#fff;border-left:6px solid var(--b);border-radius:12px;padding:10px 14px;margin:8px 0;font-style:italic}
.q{font-weight:800}.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--t);border:2px solid var(--pl);margin:6px 0;border-radius:14px}
.opt.sel{border-color:var(--p);background:var(--pl)}.opt.ok{border-color:var(--ok);background:#dff5e8}.opt.no{border-color:var(--no);background:#fde3e3}
.fb{margin:8px 0;font-weight:700}.fb.good{color:var(--ok)}.fb.bad{color:var(--no)}.lock{pointer-events:none}
.zs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.zone{background:var(--bl);border-radius:14px;padding:8px}.slot{min-height:46px;border:2px dashed var(--b);border-radius:10px;margin-top:4px;padding:3px}
.pool{min-height:54px;margin:10px 0;padding:6px;border-radius:14px;background:var(--pl);display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:2px solid var(--p);border-radius:12px;padding:6px 10px;cursor:grab;user-select:none;font-size:.92em}.chip.sel{background:var(--p);color:#fff}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.menus{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mc{background:#fff;border-radius:20px;padding:16px;text-align:center;cursor:pointer;border:3px solid var(--pl)}.mc.lk{opacity:.55}
.mc .ic{font-size:2.4em}.lv{display:inline-block;border-radius:8px;padding:1px 10px;color:#fff;font-weight:800;font-size:.8em}
.l1{background:#2e9d62}.l2{background:#e39a12}.l3{background:#d64545}
#mod{position:fixed;inset:0;background:rgba(60,20,40,.4);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#mod[hidden]{display:none}#mod .card{max-height:90vh;overflow:auto;text-align:center}
.av{width:110px;height:110px;border-radius:50%;border:4px solid var(--p);object-fit:cover;margin:auto;display:flex;align-items:center;justify-content:center;background:var(--pl);color:var(--p);font-size:2em;font-weight:800}
input{font:inherit;width:100%;padding:10px 14px;border-radius:14px;border:2px solid var(--pl);margin:4px 0}.err{color:var(--no);font-weight:700;min-height:1.3em;font-size:.9em}
table{width:100%;border-collapse:collapse}td,th{border:1px solid #e8b9cb;padding:5px 8px;text-align:left}
#sb{position:fixed;top:8px;right:8px;z-index:8;padding:6px 12px;margin:0}
.tick{overflow:hidden;border-radius:999px;background:linear-gradient(90deg,var(--pl),var(--bl));margin:8px 0 12px;padding:6px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tk{display:flex;width:max-content;animation:tkm 42s linear infinite;will-change:transform}.tick:hover .tk{animation-play-state:paused}@keyframes tkm{to{transform:translateX(-50%)}}
.ti{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:3px 16px 3px 4px;margin:0 8px;font-weight:800;color:var(--p);white-space:nowrap;box-shadow:0 2px 8px rgba(216,27,96,.15)}
.ti i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:1.1em}
.pic{border-radius:18px;overflow:hidden;margin:6px 0;border:3px solid #fff;box-shadow:0 4px 14px rgba(216,27,96,.15)}.pic svg{display:block;width:100%;height:auto;max-height:190px}
svg *{transform-box:fill-box;transform-origin:center}
.sun{animation:sn 4s ease-in-out infinite}@keyframes sn{50%{transform:scale(1.15);opacity:.85}}
.drift{animation:dr 7s ease-in-out infinite alternate}@keyframes dr{to{transform:translateX(24px)}}
.rain{animation:rn 1s linear infinite}@keyframes rn{from{transform:translateY(-4px);opacity:0}50%{opacity:1}to{transform:translateY(8px);opacity:0}}
.wave{animation:wv 3s ease-in-out infinite alternate}@keyframes wv{to{transform:translateX(10px)}}
.wy{animation:wy 2.5s ease-in-out infinite alternate}@keyframes wy{to{transform:translateY(3px)}}
.swim{animation:sw 6s ease-in-out infinite alternate}@keyframes sw{to{transform:translateX(40px)}}.swim.b{animation-duration:7s;animation-direction:alternate-reverse}
.jump{animation:jp 2.4s ease-in-out infinite}@keyframes jp{50%{transform:translateY(-16px) rotate(-20deg)}}
.bob{animation:bb 3s ease-in-out infinite}@keyframes bb{50%{transform:translateY(-4px) rotate(2deg)}}
.sway{animation:sy 3.5s ease-in-out infinite}@keyframes sy{50%{transform:scale(1.07) rotate(3deg)}}
.crab{animation:cr 4s ease-in-out infinite alternate}@keyframes cr{to{transform:translateX(24px)}}
.rice{animation:ri 2.2s ease-in-out infinite alternate;transform-origin:bottom center}@keyframes ri{to{transform:skewX(8deg)}}
.peck{animation:pk 2.6s ease-in-out infinite;transform-origin:bottom center}@keyframes pk{40%{transform:rotate(5deg) translateY(2px)}}
.egg{animation:eg 1.6s ease-in-out infinite}@keyframes eg{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.float{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
.tw{animation:tw 1.8s ease-in-out infinite}@keyframes tw{50%{transform:scale(1.35) rotate(20deg)}}
.grow{animation:gr 2.8s ease-in-out infinite;transform-origin:bottom center}@keyframes gr{50%{transform:scaleY(1.12)}}
.pop{animation:po 1.6s ease-in-out infinite}@keyframes po{50%{transform:scale(1.18)}}
.scan{animation:sc 3.4s ease-in-out infinite alternate}@keyframes sc{to{transform:translate(46px,6px)}}
.bub{animation:bu 2.4s ease-in-out infinite}.bub.b{animation-delay:1.2s}@keyframes bu{50%{transform:scale(1.05)}}
.wv{animation:wa 1.4s ease-in-out infinite}@keyframes wa{50%{opacity:.25}}
.dots circle{animation:dt 1.2s ease-in-out infinite}.dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}@keyframes dt{50%{transform:translateY(-4px);opacity:.4}}

/* Teka-teki silang interaktif */
.cross-wrap{overflow-x:auto;margin:12px 0;padding:8px;background:#fff8fb;border-radius:16px}
.cross-grid{display:grid;gap:3px;width:max-content;margin:0 auto}
.cross-cell{width:clamp(25px,5.3vw,38px);height:clamp(25px,5.3vw,38px);position:relative}
.cross-cell.block{background:transparent}
.cross-cell input{width:100%;height:100%;margin:0;padding:0;text-align:center;text-transform:uppercase;font-weight:900;font-size:clamp(14px,3vw,19px);border:2px solid #e8b9cb;border-radius:5px;background:#fff;color:#3b1f2b}
.cross-cell input:focus{outline:3px solid #f6b3cb;background:#fff4f8}
.cross-cell input.good{background:#dff5e8;border-color:#2e9d62}
.cross-cell input.bad{background:#fde3e3;border-color:#d64545}
.cross-num{position:absolute;top:0;left:2px;font-size:9px;font-weight:900;line-height:1;color:#d81b60;pointer-events:none}
.cross-clues{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cross-clues section{background:#fff;border:1px solid #f3c6d7;border-radius:14px;padding:10px}
.cross-clues h3{margin-top:0}
.cross-clues label{display:block;margin:8px 0;font-size:.94em}
.cross-clues input{padding:6px 8px;margin-top:3px;text-transform:uppercase}

@media print{.scr:not(#report){display:none!important}.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;backdrop-filter:none}}
@keyframes cm{from{transform:translateX(-90px)}to{transform:translateX(300px)}}
.cl{animation:cm 24s linear infinite}.cl.b{animation-duration:34s;animation-delay:-14s}
.bd{animation:bf 9s linear infinite}@keyframes bf{0%{transform:translate(-30px,0)}25%{transform:translate(55px,-8px)}50%{transform:translate(140px,4px)}75%{transform:translate(215px,-6px)}100%{transform:translate(280px,0)}}
.sail{animation:sl 9s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(70px)}}
.noanim *{animation:none!important}
#ab{position:fixed;top:8px;right:116px;z-index:8;padding:6px 12px;margin:0}
#mb{position:fixed;top:8px;right:62px;z-index:8;padding:6px 12px;margin:0}
@media(prefers-reduced-motion:reduce){.tk,.sun,.drift,.rain,.wave,.wy,.swim,.jump,.bob,.sway,.crab,.rice,.peck,.egg,.float,.tw,.grow,.pop,.scan,.bub,.wv,.dots circle{animation-duration:0.01ms!important;animation-iteration-count:1!important}}

</style></head><body>

<div id="cover" class="scr"><div class="card c">
<span class="badge">Bahasa Inggris</span><span class="badge">Kelas IV · Fase B · MI</span>

<label>Kelas</label><input id="fk" autocomplete="off" placeholder="contoh: IV"><div class="err" id="e2"></div>

<script>
// ==========================================
// KONFIGURASI GOOGLE APPS SCRIPT
// Ganti URL di bawah ini dengan URL Web App Anda
const GAS_URL = "https://script.google.com/macros/s/AKfycbwicXUFy7Oh8VWjv6y8vAzzLv6lBLcHL29sMgbjbY6_38N_TJ3ezAcxwB0T06JPmqg3/exec";
// ==========================================

const $=s=>document.querySelector(s),sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const S={n:'',k:'',ld:[],learn:0,play:0,pok:0,test:[]};

// --- FUNGSI INTEGRASI GAS ---
function sendDataToGAS(payload) {
  if (GAS_URL === "URL_GAS_ANDA_DISINI") return;
  fetch(GAS_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).catch(e => console.log("Gagal mengirim data:", e));
}

function syncDataSoal() {
  if (GAS_URL === "URL_GAS_ANDA_DISINI") return;
  let soalList = [];
  PL.forEach((q, i) => soalList.push({menu: "Bermain", no: i+1, tipe: q.t, pertanyaan: q.q, kunci: key(q)}));
  CW.forEach((q, i) => soalList.push({menu: "TTS", no: i+1, tipe: "Silang", pertanyaan: q.clue, kunci: q.w}));
  TS.forEach((q, i) => soalList.push({menu: "Berlatih", no: i+1, tipe: q.t, pertanyaan: q.q, kunci: key(q)}));
  sendDataToGAS({ type: "soal", soalList: soalList });
}
// -----------------------------

function go(id){const before=document.querySelector('.scr.on')?.id;document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));scrollTo(0,0);if(before&&before!==id)snd(520,.12,'triangle',.07)}
function mod(h,x){$('#modc').innerHTML=h+'<br><button onclick="cm()">'+(x||'Tutup')+'</button>';$('#mod').hidden=false}
function cm(){$('#mod').hidden=true}
setTimeout(()=>go('cover'),1900);
const AY=[{ar:'وَقُلْ رَبِّ زِدْنِي عِلْمًا',ref:'QS. Thaha [20]: 114',id:'Dan katakanlah (Muhammad), “Ya Tuhanku, tambahkanlah ilmu kepadaku.”'},
{ar:'وَقُولُوا لِلنَّاسِ حُسْنًا',ref:'QS. Al-Baqarah [2]: 83',id:'…dan bertutur katalah yang baik kepada manusia.'}];
const ay=k=>`<div class="ay"><div class="ar">${AY[k].ar}</div><small>${AY[k].ref}</small><p>${AY[k].id}</p><small>Terjemahan Kemenag RI</small></div>`;
function dev(){mod(`<img class="av" src="https://iili.io/nvQhMRR.md.jpg" alt="Foto guru dan pengembang media pembelajaran" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'av',textContent:'MS'}))"><p><b>Guru / Pengembang Media Pembelajaran</b></p><h2>Mardawati, S.S</h2><p>MIS Al-Khairaat Paguat</p><p>mardawati_2001@madrasah.kemenag.go.id</p>`,'Kembali ke Cover')}
function goal(){mod(`<h2>Tujuan Pembelajaran</h2><p>Murid dapat menganalisis hasil dari ide pokok yang terdapat di teks lisan dengan memiliki kesadaran dalam berkomunikasi secara efektif dan sopan, sebagai wujud cinta terhadap ilmu.</p>${ay(0)}<div class="box kbc">💗 Cintai dirimu dengan belajar, dan cintai sesama dengan bertutur kata yang baik.</div>`,'Kembali ke Cover')}

function sub(){
  const n=$('#fn').value.trim(),k=$('#fk').value.trim();
  $('#e1').textContent=n?'':'Tulis namamu dulu ya.';$('#e2').textContent=k?'':'Tulis kelasmu dulu ya.';
  if(n&&k){
    S.n=n; S.k=k; gi=0; go('intro'); rg();
    syncDataSoal(); // Sinkronisasi soal ke GAS saat pengguna login
  }
}

let gi=0;
const G=()=>[`<h2>Selamat Datang, ${S.n}!</h2><p>Kamu akan belajar menemukan <b>ide pokok</b> dari teks lisan dan multimodal, dengan contoh dari Paguat, Pohuwato.</p>`,
`<h2>Cara Belajar</h2><p>Baca setiap slide materi, lalu selesaikan tantangan di bagian bawah. Slide selesai setelah jawabanmu benar.</p>`,
`<h2>Cara Menjawab</h2><p>Pilih jawaban dengan sentuhan. Untuk menyusun atau menjodohkan: <b>seret</b> kartu dengan mouse, atau <b>ketuk kartu lalu ketuk kotaknya</b> di layar sentuh.</p>`,
`<h2>Menu Terkunci Bertahap</h2><p>Belajar 🔓 → Bermain 🔒 → Berlatih 🔒. Selesaikan satu tahap untuk membuka tahap berikutnya.</p>`];
function rg(){const g=G();$('#gb').innerHTML=g[gi];$('#gp').disabled=!gi;const l=gi==g.length-1;$('#gn').textContent=l?'Masuk ke Menu Utama':'Selanjutnya (Next)';$('#gp').onclick=()=>{gi--;rg()};$('#gn').onclick=()=>{if(l)menu();else{gi++;rg()}}}
function menu(){if(window.speechSynthesis)speechSynthesis.cancel();go('menu');$('#mh').innerHTML=`<h2>👤 ${S.n} · Kelas ${S.k}</h2><p>Pilih menu belajarmu</p>`;
const m=[['📖','Belajar',1,'Pelajari 7 slide materi.'],['🎮','Bermain',S.learn,'Selesaikan semua slide Belajar dulu.'],['✏️','Berlatih',S.play,'Selesaikan menu Bermain dulu.'],['📚','Referensi',1,'']];
$('#mm').innerHTML=m.map((x,i)=>`<div class="mc ${x[2]?'':'lk'}" data-i="${i}"><div class="ic">${x[2]?x[0]:'🔒'}</div><h3>${x[1]} ${x[2]?'🔓':'🔒'}</h3></div>`).join('');
document.querySelectorAll('.mc').forEach(e=>e.onclick=()=>{const i=+e.dataset.i;if(!m[i][2])mod(`<h2>Menu masih terkunci 🔒</h2><p>${m[i][3]} Semangat, kamu pasti bisa!</p>`);else[startLearn,startPlay,startTest,refs][i]()})}
function refs(){mod(`<h2>📚 Referensi</h2><ol style="text-align:left"><li>Buku Bahasa Inggris, Penerbit Erlangga.</li><li>Buku mata pelajaran dari Kemendikbud.</li><li>Aset gambar dan kode HTML dibuat secara otomatis oleh AI.</li></ol>`,'Kembali ke Menu')}
let AC,mute=false,bgmOn=false,bgmTimer=null,bgmStep=0;
function musicToggle(){if(bgmOn){bgmOn=false;clearTimeout(bgmTimer);bgmTimer=null;$('#mb').textContent='🎵 Musik';return}bgmOn=true;$('#mb').textContent='🎵 Musik: ON';if(!mute)playBgm()}
function playBgm(){if(!bgmOn||mute)return;const notes=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46];snd(notes[bgmStep%notes.length],.28,'sine',.025);bgmStep++;bgmTimer=setTimeout(playBgm,420)}

const CW=[
 {w:'MAINIDEA',r:0,c:5,d:'H',clue:'Istilah bahasa Inggris untuk gagasan utama yang merangkum isi teks.'},
 {w:'MANGROVE',r:0,c:5,d:'V',clue:'Jenis hutan pesisir yang akarnya membantu melindungi pantai dari abrasi.'},
 {w:'GARDEN',r:7,c:1,d:'H',clue:'Tempat kelas IV menanam sayuran sebelum berbagi hasil panen.'},
 {w:'POSTER',r:5,c:4,d:'H',clue:'Jenis teks visual yang memadukan judul, gambar, dan tulisan ajakan.'},
 {w:'RADIO',r:7,c:3,d:'V',clue:'Media audio yang menyampaikan pengumuman atau berita melalui suara.'},
 {w:'RIVER',r:10,c:2,d:'H',clue:'Kata bahasa Inggris untuk sungai, sumber air yang dibahas Pak Rahman.'},
 {w:'MALEO',r:2,c:8,d:'V',clue:'Nama burung khas Sulawesi yang perlu dilindungi karena merupakan satwa unik daerah ini.'},
 {w:'WATER',r:3,c:7,d:'H',clue:'Kata bahasa Inggris untuk air, yang perlu dihemat saat mengairi sawah.'},
 {w:'LISTEN',r:2,c:0,d:'H',clue:'Kata kerja bahasa Inggris yang berarti menyimak suara dengan saksama.'}
];
function startCrossword(){
 const rows=12,cols=13,offset=0;
 const cells={},nums={},starts=[];
 CW.forEach((w,i)=>{starts.push(w);for(let j=0;j<w.w.length;j++){const r=w.r+(w.d==='V'?j:0),c=w.c+(w.d==='H'?j:0),k=r+','+c;cells[k]=w.w[j];}});
 let num=0;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const k=r+','+c;if(!(k in cells))continue;
   const across=CW.some(w=>w.d==='H'&&w.r===r&&w.c===c),down=CW.some(w=>w.d==='V'&&w.r===r&&w.c===c);
   if(across||down)nums[k]=++num;
 }
 const numberOf=w=>nums[w.r+','+w.c];
 let html=`<div class="c"><h2>🧩 Teka-Teki Silang</h2><p>Lengkapi kotak berdasarkan petunjuk mendatar dan menurun. Gunakan huruf A–Z.</p>
 <div class="badge">9 kata rahasia</div><div class="cross-wrap"><div class="cross-grid" style="grid-template-columns:repeat(${cols},clamp(25px,5.3vw,38px))">`;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
   const k=r+','+c;
   if(!(k in cells)){html+='<div class="cross-cell block"></div>';continue}
   const clueNum=nums[k]||'';
   html+=`<div class="cross-cell">${clueNum?`<span class="cross-num">${clueNum}</span>`:''}<input aria-label="Baris ${r+1} kolom ${c+1}" maxlength="1" data-cell="${k}" autocomplete="off"></div>`;
 }
 html+=`</div></div><div class="cross-clues"><section><h3>➡️ Mendatar</h3>`;
 CW.filter(w=>w.d==='H').forEach(w=>{html+=`<label><b>${numberOf(w)}.</b> ${w.clue}</label>`});
 html+=`</section><section><h3>⬇️ Menurun</h3>`;
 CW.filter(w=>w.d==='V').forEach(w=>{html+=`<label><b>${numberOf(w)}.</b> ${w.clue}</label>`});
 html+=`</section></div><div class="fb" id="cwfb" aria-live="polite"></div>
 <button onclick="checkCrossword()">Periksa Jawaban</button><button class="alt" onclick="showCrosswordAnswers()">Lihat Petunjuk Huruf</button><button class="alt" onclick="startPlay()">Pilih Game Lain</button><button class="alt" onclick="menu()">Menu Utama</button></div>`;
 $('#pb').innerHTML=html;
 const inputs=[...document.querySelectorAll('.cross-cell input')];
 inputs.forEach((inp,i)=>inp.addEventListener('input',()=>{inp.value=inp.value.replace(/[^a-z]/ig,'').toUpperCase().slice(0,1);if(inp.value&&inputs[i+1])inputs[i+1].focus()}));
}
function checkCrossword(){
 let correct=0,total=0;
 const cellMap={};CW.forEach(w=>{for(let j=0;j<w.w.length;j++){const r=w.r+(w.d==='V'?j:0),c=w.c+(w.d==='H'?j:0);cellMap[r+','+c]=w.w[j]}});
 document.querySelectorAll('.cross-cell input').forEach(inp=>{total++;const ok=(inp.value||'').toUpperCase()===cellMap[inp.dataset.cell];inp.classList.toggle('good',ok);inp.classList.toggle('bad',!ok);if(ok)correct++});
 const fb=$('#cwfb');
 if(correct===total){fb.className='fb good';fb.textContent='🎉 Hebat! Semua huruf benar. Kamu menyelesaikan Teka-Teki Silang!';snd(660,.12,'triangle',.12);setTimeout(()=>snd(990,.18,'sine',.1),130);S.play=1;fb.insertAdjacentHTML('afterend','<p><b>Skor: 100/100</b> 🏆</p><button onclick="menu()">Selesai & Kembali ke Menu</button>')}
 else{fb.className='fb bad';fb.textContent=`Kamu benar ${correct} dari ${total} kotak. Kotak hijau benar, kotak merah perlu diperbaiki. Ayo coba lagi!`;snd(190,.18,'sawtooth',.1)}
}
function showCrosswordAnswers(){
 const cellMap={};CW.forEach(w=>{for(let j=0;j<w.w.length;j++){const r=w.r+(w.d==='V'?j:0),c=w.c+(w.d==='H'?j:0);cellMap[r+','+c]=w.w[j]}});
 document.querySelectorAll('.cross-cell input').forEach(inp=>{inp.value=cellMap[inp.dataset.cell];inp.classList.remove('bad');inp.classList.add('good')});
 $('#cwfb').className='fb good';$('#cwfb').textContent='Petunjuk huruf ditampilkan. Tekan Periksa Jawaban untuk menyelesaikan.';
}
